# Signing in GitHub Actions instead of on Ben's Mac: an option, not on.
#
# This file is not in .github/workflows on purpose. A workflow you start by
# hand (workflow_dispatch) only runs from a repository's default branch,
# and this site lives on the `site` branch, which must never be merged
# into `main`. To use it, put it in .github/workflows/ of a separate
# private repository (for example humanshaped/credential-signing) that
# holds a copy of tools/credential/ and assets/credential-lib.js and the
# contexts, and add the key file's whole contents as the repository
# secret HUMANSHAPED_SIGNING_KEY. Until both exist, nothing here runs.
#
# Paste the request /teach/ copies into the `request` input; the signed
# credential comes back as a downloadable artifact to attach on /teach/.
# A run's inputs are visible to anyone who can see the repository's
# Actions, which is one more reason the repository should be private.
name: Sign a credential
on:
  workflow_dispatch:
    inputs:
      request:
        description: The signing request copied from /teach/ (JSON)
        required: true
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev
        working-directory: tools/credential
      - name: Sign
        env:
          HUMANSHAPED_SIGNING_KEY: ${{ secrets.HUMANSHAPED_SIGNING_KEY }}
          REQUEST: ${{ inputs.request }}
        run: |
          printf '%s' "$REQUEST" > request.json
          node tools/credential/sign.mjs request.json --out signed.json
      - uses: actions/upload-artifact@v4
        with:
          name: signed-credential
          path: signed.json
          retention-days: 1
