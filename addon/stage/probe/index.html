<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Probe</title>
<style>html,body{margin:0;height:100%;background:#fff}#log{position:fixed;left:0;right:0;bottom:0;background:#000;color:#0f0;font:12px monospace;padding:4px;white-space:pre-wrap;z-index:9}iframe{border:0;width:100%;height:100%}</style></head>
<body><iframe id="f" sandbox="allow-scripts"></iframe><div id="log">starting</div>
<script src="https://www.gstatic.com/meetjs/addons/1.2.0/meet.addons.js"></script>
<script src="/assets/addon-config.js"></script>
<script>
// TEMPORARY: can a stage run a public repository's page with no Pages, no app, and no sign-in?
var log=document.getElementById('log'),say=function(x){log.textContent=x+'\n'+log.textContent.slice(0,400)};
var t=Date.now();
var cfg=window.MEET_ADDON||{};
var num=cfg.cloudProjectNumber;
window.meet.addon.createAddonSession({cloudProjectNumber:String(num)}).then(function(s){return s.createMainStageClient()}).then(function(){say('stage client ok')},function(e){say('stage client failed '+e)});
fetch('https://api.github.com/repos/humanshaped/stage-template/commits/main').then(function(r){return r.json()}).then(function(c){
  say('sha '+c.sha.slice(0,7)+' in '+(Date.now()-t)+'ms');
  return fetch('https://raw.githubusercontent.com/humanshaped/stage-template/'+c.sha+'/index.html');
}).then(function(r){return r.text()}).then(function(h){
  say('page '+h.length+'b in '+(Date.now()-t)+'ms; rendered sandboxed');
  document.getElementById('f').srcdoc=h;
}).catch(function(e){say('failed '+e)});
</script></body></html>
