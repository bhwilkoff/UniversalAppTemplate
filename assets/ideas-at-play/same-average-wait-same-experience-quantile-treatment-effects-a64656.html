<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Beyond the average: quantile treatment effects in Uber's pickup-time experiment</title>
<style>
:root{
  --bg:#fbfaf7;--card:#ffffff;--ink:#22252a;--muted:#5b626d;--rule:#d6d2ca;--faint:#efece6;
  --accent:#2E4057;--c0:#c0392b;--c1:#1f4fa3;--bad:#b4480a;--good:#1d7a4a;--ok:#1d7a4a;--okbg:#e6f4ea;--no:#b4480a;--nobg:#fdeee3;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#16181c;--card:#1f2228;--ink:#ece9e3;--muted:#a9afb8;--rule:#3b4048;--faint:#2a2e35;--accent:#9dbfe3;--c0:#ff8a7a;--c1:#8fb4ff;--bad:#ffa366;--good:#6fd39b;--ok:#6fd39b;--okbg:#17301f;--no:#ffa366;--nobg:#3a2414;}
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
main{max-width:1100px;margin:0 auto;padding:12px 20px 30px}
h1{font-size:1.3rem;line-height:1.25;margin:0;font-weight:650}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
button{font:inherit;font-size:14px;min-height:30px;padding:4px 11px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
button:hover:not(:disabled){border-color:var(--muted)}
button[aria-pressed="true"],button[aria-current="step"]{background:var(--accent);color:var(--card);border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--card);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;border-inline-end:1px solid var(--rule)}
.seg button:last-child{border-inline-end:0}
.stepbar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.stepbar button{font-size:13px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:12px 20px 14px}
.stepnum{font-size:13px;color:var(--muted);margin:0}
#stepH{font-size:1.2rem;margin:.1em 0 .25em}
.hint{margin:0 0 .5em;max-width:84ch}

.note{font-size:13px;color:var(--muted);margin:.3em 0 0}
.ctl{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;margin:.2em 0 .3em}
.ctl label{display:flex;align-items:center;gap:8px;font-size:14px}

.bad{color:var(--bad)} .good{color:var(--good)}

svg text{fill:var(--ink);font-size:13px}
svg .muted{fill:var(--muted)}
.charts.side{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:820px){.charts.side{grid-template-columns:minmax(0,1fr)}}
.box{border-inline-start:3px solid var(--accent);padding:6px 12px;margin:.5em 0 0;background:var(--faint);border-radius:0 8px 8px 0;font-size:14.5px}

.kind{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-inline-end:6px}

#stepNum{display:none}

.verdict{padding:7px 12px;margin-top:.35em} .verdict .vi{width:28px;height:28px;font-size:17px}

button.is-right,button.is-right[aria-pressed="true"]{border:2px solid var(--ok);background:var(--okbg);color:var(--ink)}
button.is-wrong,button.is-wrong[aria-pressed="true"]{border:2px solid var(--no);background:var(--nobg);color:var(--ink)}
button.is-right::before{content:"\2713  ";font-weight:800;color:var(--ok)}

body.projector .verdict{font-size:19px} body.projector .verdict .vt{font-size:1.3rem} body.projector .verdict .vi{width:44px;height:44px;font-size:26px}

</head>
<body class="laptop">
<main>
  <div class="topbar">
    <h1>Same average wait, same experience?</h1>
    <div class="seg" role="group" aria-label="Text size">
      <button type="button" id="scLaptop" aria-pressed="true">Laptop</button>
      <button type="button" id="scProj" aria-pressed="false">Projector</button>
    </div>
  </div>
  <nav class="stepbar" id="stepbar" aria-label="Steps"></nav>
  <section class="card" aria-labelledby="stepH">
    <p class="stepnum" id="stepNum"></p>
    <h2 id="stepH" tabindex="-1"></h2>
    <p class="quote" id="stepQuote"></p>
    <p class="hint" id="stepHint"></p>

    <div class="opts" id="predOpts" role="group" aria-label="Your answer"></div>
    <div class="qrow" id="predRow"><button type="button" class="primary" id="predCheck">Check</button><div id="predFb" aria-live="polite" style="flex:1 1 300px"></div></div>
    <div class="ctl" id="ctlRow">
      <label id="lAte">Change in average ETA <input type="range" id="inAte" min="-1.5" max="1.5" step="0.1"> <output id="oAte"></output></label>
      <label id="lSpread">Spread of ETAs, new algorithm <input type="range" id="inSpread" min="0.15" max="0.6" step="0.01"> <output id="oSpread"></output></label>
      <label id="lPct">Percentile <input type="range" id="inPct" min="1" max="99" step="1"> <output id="oPct"></output></label>
      <button type="button" id="markBtn">Mark this percentile</button>
    </div>
    <div class="readouts" aria-live="polite" id="readouts"></div>
    <div class="charts" id="charts">
      <div id="distWrap"><svg class="chart" id="dist" viewBox="0 0 760 320" role="img" aria-label=""></svg></div>
      <div id="qWrap" hidden><svg class="chart" id="qcurve" viewBox="0 0 500 300" role="img" aria-label=""></svg></div>
    </div>
    <div id="markFb" aria-live="polite"></div>
    <div id="mcq" hidden>
      <p class="q" id="mcqQ"></p>
      <div class="opts" role="group" aria-labelledby="mcqQ" id="mcqOpts"></div>
      <div><button type="button" class="primary" id="checkBtn" style="margin-top:8px">Check</button></div>
      <div id="mcqFb" aria-live="polite"></div>
    </div>
    <div id="tuneBox" aria-live="polite" hidden></div>

    <div class="moves">
      <button type="button" id="prevStep">← Previous</button>
      <button type="button" id="nextStep">Next →</button>
    </div>
  </section>

  <details>
    <summary>Assumptions</summary>
    <ul id="ledger"></ul>
    <p class="note">Left out: how Uber estimates QTEs from samples (and their uncertainty), and riders interacting with each other in the marketplace.</p>
  </details>
</main>
<script>
(function(){
'use strict';
// Big, obvious feedback on an answer: kind is 'right', 'wrong' or 'locked' (a prediction recorded, answer to come).
function verdict(kind, text, title){
  var t = title || (kind === 'right' ? 'Right!' : kind === 'wrong' ? 'Not quite. Try another answer.' : 'Prediction locked in');
  return '<div class="verdict ' + kind + '" role="status"><span class="vi" aria-hidden="true">' + (kind === 'right' ? '✓' : kind === 'wrong' ? '✗' : '●') + '</span><div><p class="vt">' + t + '</p><p>' + text + '</p></div></div>';
}
// Mark the chosen option button right or wrong once checked (others plain).
function markOpts(box, attr, chosen, right, checked){
  box.querySelectorAll('[' + attr + ']').forEach(function(b){
    var v = b.getAttribute(attr), on = checked && v === chosen;
    b.classList.toggle('is-right', on && v === right);
    b.classList.toggle('is-wrong', on && v !== right);
  });
}

/* ---------- Model ----------
   ETA in minutes is lognormal in both arms.
     Old algorithm (control):   mean 6 min, log-SD s0 = 0.22.
     New algorithm (treatment): mean 6 + ate, log-SD s1 (the article's case: ate = 0, s1 = 0.45).
   With mean M and log-SD s, the quantile at θ is  M · exp(s z − s²/2),  z = Φ⁻¹(θ).
   QTE(θ) = Q1(θ) − Q0(θ);  ATE = mean1 − mean0 = ate, which equals the average of QTE(θ) over θ. */
var MEAN0 = 6, S0 = 0.22, XMAX = 22;
var ARTICLE = { ate: 0, spread: 0.45 };
function model(p){
  var m1 = MEAN0 + p.ate, s1 = p.spread;
  var g0 = function(z){ return MEAN0 * Math.exp(S0 * z - S0 * S0 / 2); };
  var g1 = function(z){ return m1 * Math.exp(s1 * z - s1 * s1 / 2); };
  return {
    g0: g0, g1: g1, mean0: MEAN0, mean1: m1, ate: p.ate,
    q0: function(t){ return g0(zq(t)); }, q1: function(t){ return g1(zq(t)); },
    qte: function(t){ var z = zq(t); return g1(z) - g0(z); }
  };
}
function zq(p){
  var a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02, 1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
  var b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02, 6.680131188771972e+01, -1.328068155288572e+01];
  var c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00, -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
  var d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00, 3.754408661907416e+00];
  var pl = 0.02425, q, r;
  if(p <= 0) return -Infinity; if(p >= 1) return Infinity;
  if(p < pl){ q = Math.sqrt(-2 * Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(p > 1 - pl){ q = Math.sqrt(-2 * Math.log(1 - p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  q = p - 0.5; r = q * q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q / (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
// Standard normal CDF (Abramowitz–Stegun 7.1.26 via erf; |error| < 1.5e-7).
function Phi(z){
  var x = Math.abs(z) / Math.SQRT2, t = 1 / (1 + 0.3275911 * x);
  var e = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
  return z >= 0 ? (1 + e) / 2 : (1 - e) / 2;
}
function phi(z){ return Math.exp(-z * z / 2) / Math.sqrt(2 * Math.PI); }
function densityPts(g){ var pts = []; for(var z = -3.6; z <= 3.6001; z += 0.03){ var h = 1e-4; pts.push([g(z), phi(z) * 2 * h / (g(z + h) - g(z - h))]); } return pts; }
function avgQte(m, n){ var s = 0; for(var i = 0; i < n; i++) s += m.qte((i + 0.5) / n); return s / n; }
// Article case: the two quantile functions cross where s1 z − s1²/2 = s0 z − s0²/2, i.e. z = (s0 + s1)/2.
var CROSS = 100 * Phi((S0 + ARTICLE.spread) / 2);

/* ---------- Steps and text ---------- */
var STEPS = [
  { tab: '1 Predict', h: 'The new algorithm leaves the average ETA unchanged. Did it change anyone’s wait?',
    quote: '“We might learn, for example, that the average ETA of the new algorithm is no different from the average ETA of the old algorithm (an ATE of zero). But does this really mean there is no meaningful difference between the two algorithms?” (Uber Engineering)',
    hint: 'The chart shows pickup times (ETA) for riders under each algorithm. Both have the same mean, so ATE = E[Y¹] − E[Y⁰] = 0. Agree on an answer as a group.' },
  { tab: '2 Find the switch', h: 'Where does the new algorithm start making riders wait longer?',
    quote: '',
    hint: 'The QTE at a percentile compares the two ETA distributions at that percentile. Slide the percentile until the QTE changes sign, then mark it. Remember: for ETA, lower is better.' },
  { tab: '3 Every quantile', h: 'Which rides does the new algorithm improve?',
    quote: '“We can, of course, calculate the QTE for many different quantiles, for example from the 1st through the 99th.” (Uber Engineering)',
    hint: 'The second chart plots the QTE at every percentile (the article’s Figure 3). The solid line at zero is the ATE.' },
  { tab: '4 Tune it', h: 'Can you make every percentile better?',
    quote: '“People remember negative experiences more strongly than positive ones.” (Uber Engineering, citing Baumeister et al. 2001)',
    hint: 'Change the new algorithm. Find a setting where no percentile of ETA gets longer: the QTE is at or below zero everywhere. What did it take?' },
  { tab: '5 Interpret', h: 'What does the QTE curve tell Uber?',
    quote: '',
    hint: 'Back to the article’s case: ATE = 0, wider spread under the new algorithm.' }
];
var PRED = [
  ['none', 'No: an ATE of zero means no one’s wait changed'],
  ['some', 'Yes: some pickups got faster and some slower'],
  ['cant', 'We can’t tell from this chart']
];
var PRED_FB = {
  none: 'An ATE of zero only says the averages match. The two curves have different shapes: the new algorithm gives more very short and more very long waits.',
  some: 'Same mean, different shapes: the new algorithm gives more very short and more very long waits. The next steps measure where each happens.',
  cant: 'The chart is enough: the curves have the same mean but different shapes, so some pickups got faster and some slower.'
};
var Q3 = {
  q: 'Which rides get a positive effect from the new algorithm, meaning a shorter wait?',
  opts: [['b20', 'Roughly the bottom 20 percent of ETA'], ['b60', 'Roughly the bottom 60 percent of ETA'], ['t20', 'Roughly the top 20 percent of ETA'], ['t40', 'Roughly the top 40 percent of ETA']],
  right: 'b60',
  fb: {
    b20: 'Too narrow. The QTE is below zero (shorter waits) all the way up to about the ' + Math.round(CROSS) + 'th percentile, not just the bottom 20 percent.',
    b60: 'Right. Below about the ' + Math.round(CROSS) + 'th percentile the QTE is negative: those pickup times are shorter under the new algorithm. Above it they are longer.',
    t20: 'That is where the QTE is largest and positive, which for ETA means longer waits: the worst effect, not the best. The sign trap: a “positive” QTE on ETA is bad for riders.',
    t40: 'The top 40 percent is where the QTE is above zero, meaning longer waits. For ETA a positive QTE is bad for riders; the improvement is in the bottom ' + Math.round(CROSS) + ' percent or so.'
  }
};
var EXIT = {
  q: 'Which is the best interpretation of the QTE curve?',
  opts: [
    ['a', 'The new algorithm has no effect, because the ATE is zero.'],
    ['b', 'Short and typical pickup times get shorter, but the longest pickup times get longer; averaged over all quantiles, the changes cancel.'],
    ['c', 'The particular riders who waited longest under the old algorithm will wait even longer under the new one.']
  ],
  right: 'b',
  fb: {
    a: 'Not quite. An ATE of zero is the average of the QTE curve; the curve itself shows large changes in both directions that cancel out.',
    b: 'Right. And this matters to Uber: riders remember the long waits more than the short ones, so a zero ATE can hide a worse experience in the tail that the QTE exposes.',
    c: 'Not quite. QTEs compare two distributions, not the same riders. They say the slowest pickups are slower under the new algorithm, not which riders get them.'
  }
};
var LEDGER = [
  ['data', 'The ETA distributions are illustrative, built to match the shapes in the Uber Engineering article’s Figures 1 and 3, not Uber data.'],
  ['distribution', 'ETA is lognormal under both algorithms. Old algorithm: mean 6 minutes, log-SD 0.22. New algorithm (article case): same mean, log-SD 0.45.'],
  ['interpretation', 'Riders are randomized to an algorithm, so the ATE is the difference in mean ETA and each QTE is the difference between the two arms’ ETA quantiles. Neither says what any one rider would experience under both.'],
  ['parameter', 'Step 4: change in average ETA from −1.5 to +1.5 minutes; log-SD of the new algorithm from 0.15 to 0.60; percentile from 1st to 99th.'],
  ['simplification', 'A negative QTE (shorter pickup time) counts as an improvement; the article’s questions call it a “positive effect”.']
];

/* ---------- State ---------- */
var state = { step: 0, pred: '', predChecked: false, pct: 50, mark: 0, q3: '', q3checked: false, ate: 0, spread: 0.45, tuned: false, exit: '', checked: false, scale: 'laptop' };
var listeners = [];
function oneOf(list, v){ return v === '' || list.some(function(o){ return o[0] === v; }); }
function validEntry(k, v){
  if(['step', 'pct', 'mark', 'ate', 'spread'].indexOf(k) >= 0) return typeof v === 'number' && isFinite(v);
  if(k === 'pred') return oneOf(PRED, v);
  if(k === 'q3') return oneOf(Q3.opts, v);
  if(k === 'exit') return oneOf(EXIT.opts, v);
  if(k === 'scale') return v === 'laptop' || v === 'projector';
  if(['q3checked', 'tuned', 'checked', 'predChecked'].indexOf(k) >= 0) return typeof v === 'boolean';
  return false;
}
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function apply(p){
  Object.keys(p || {}).forEach(function(k){
    var v = p[k];
    if(!Object.prototype.hasOwnProperty.call(state, k) || !validEntry(k, v)) return;
    if(k === 'step') v = clamp(Math.round(v), 0, STEPS.length - 1);
    if(k === 'pct') v = clamp(Math.round(v), 1, 99);
    if(k === 'mark') v = clamp(Math.round(v), 0, 99);
    if(k === 'ate') v = clamp(Math.round(v * 10) / 10, -1.5, 1.5);
    if(k === 'spread') v = clamp(Math.round(v * 100) / 100, 0.15, 0.6);
    state[k] = v;
  });
}
function getState(){ return JSON.parse(JSON.stringify(state)); }
function noneWorse(m){ for(var i = 1; i <= 99; i++){ if(m.qte(i / 100) > 0.005) return false; } return true; }
function change(p){
  apply(p);
  if(!state.tuned && state.step === 3 && noneWorse(model(state))) state.tuned = true;
  render();
  var s = getState(); listeners.forEach(function(fn){ try{ fn(s); }catch(e){} });
}
function setState(p){ if(!p || typeof p !== 'object') return; apply(p); render(); }

/* ---------- Formatting ---------- */
function mins(v){ var r = Math.round(v * 10) / 10; if(r === 0) return '0.0 min'; return (r > 0 ? '+' : '−') + Math.abs(r).toFixed(1) + ' min'; }
function plain(v){ return v.toFixed(1) + ' min'; }
function ord(n){ var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function effectWord(v){ return v > 0.05 ? ' (longer wait)' : v < -0.05 ? ' (shorter wait)' : ''; }
function cls(v){ return v > 0.05 ? 'bad' : v < -0.05 ? 'good' : ''; }
function niceTicks(lo, hi, n){
  var span = hi - lo, step = Math.pow(10, Math.floor(Math.log10(span / n))), err = span / n / step;
  step *= err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1;
  var t = [], v = Math.ceil(lo / step) * step; for(; v <= hi + 1e-9; v += step) t.push(Math.round(v * 1e6) / 1e6); return t;
}

/* ---------- Charts ---------- */
var SVGNS = 'http://www.w3.org/2000/svg';
function el(name, attrs, text){ var e = document.createElementNS(SVGNS, name); for(var a in attrs) e.setAttribute(a, attrs[a]); if(text != null) e.textContent = text; return e; }
var HALO = 'paint-order:stroke;stroke:var(--card);stroke-width:5px;stroke-linejoin:round';

        .then(function (r) { if (r.ok) store(KEY, String(score)); return r.ok; }, function () { return false; });
    }
    return new Promise(function (resolve) {
      var id = ++seq; pending[id] = resolve;
      parent.postMessage({ type: "kc:rate", versionId: cfg.versionId, id: id, score: score, comment: comment || "" }, cfg.appOrigin);
      setTimeout(function () { if (pending[id]) { delete pending[id]; resolve(false); } }, 15000);
    });
  }
  var B = "display:inline-block;margin:3px 6px 3px 0;padding:4px 10px;border:1px solid #a8a29e;border-radius:6px;background:#fff;color:#1c1917;font:inherit;cursor:pointer";
  function el(tag, attrs, text) { var e = document.createElement(tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (text) e.textContent = text; return e; }
  function show() {
    if (shown || !config || !config.ask) return;
    shown = true;
    clearInterval(timer);
    var L = config.labels;
    var box = el("div", { "data-kc-rating": "", "data-kc-personal": "", role: "region", "aria-label": L.ask, lang: L.lang, dir: L.dir,
      style: "box-sizing:border-box;max-width:760px;margin:24px auto 0;padding:10px 14px;border:1px solid #d6d3d1;border-radius:10px;background:#fafaf9;color:#1c1917;font:14px/1.5 system-ui,-apple-system,sans-serif;text-align:start" });
    var live = el("div", { "aria-live": "polite" });
    box.appendChild(live);
    function ask(msg) {
      live.innerHTML = "";
      live.appendChild(el("span", { style: "font-weight:600;margin-inline-end:8px" }, L.ask));
      [1, 2, 3].forEach(function (s) {
        var b = el("button", { type: "button", style: B }, s + " · " + L["s" + s]);
        b.addEventListener("click", function () {
          live.querySelectorAll("button").forEach(function (x) { x.disabled = true; });
          save(s, "").then(function (ok) { if (ok) comment(s); else ask(L.error); });
        });
        live.appendChild(b);
      });
      if (config.preview) live.appendChild(el("div", { style: "font-size:12px;color:#57534e" }, L.preview));
      if (msg) live.appendChild(el("div", { role: "alert", style: "color:#991b1b;font-size:13px" }, msg));
    }
    function comment(score) {
      live.innerHTML = "";
      var id = "kc-rate-comment";
      live.appendChild(el("label", { for: id, style: "display:block;font-weight:600;margin-bottom:4px" }, L.comment));
      var row = el("div", { style: "display:flex;flex-wrap:wrap;gap:6px;align-items:center" });
      var input = el("input", { id: id, type: "text", maxlength: "1000", autocomplete: "off", dir: "auto",
        style: "flex:1 1 260px;min-width:0;box-sizing:border-box;padding:5px 8px;border:1px solid #a8a29e;border-radius:6px;background:#fff;color:#1c1917;font:inherit" });
      var send = el("button", { type: "button", style: B + ";background:#292524;color:#fff;border-color:#292524" }, L.send);
      var skip = el("button", { type: "button", style: B }, L.skip);
      function done() { live.innerHTML = ""; live.appendChild(el("span", { style: "font-weight:600" }, L.thanks)); setTimeout(function () { box.remove(); }, 2000); }
      send.addEventListener("click", function () {
        var text = input.value.trim();
        if (!text) return done();
        send.disabled = skip.disabled = true;
        save(score, text).then(function (ok) { if (ok) done(); else { send.disabled = skip.disabled = false; live.appendChild(el("div", { role: "alert", style: "color:#991b1b;font-size:13px" }, L.error)); } });
      });
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") send.click(); });
      skip.addEventListener("click", done);
      row.appendChild(input); row.appendChild(send); row.appendChild(skip);
      live.appendChild(row);
      input.focus();
    }
    ask("");
    var mark = document.querySelector("[data-kc-end]"), foot = document.querySelector("footer[data-kc-credit]");
    if (mark) mark.insertAdjacentElement("afterend", box);
    else if (foot) foot.parentNode.insertBefore(box, foot);
    else document.body.appendChild(box);
  }
  function check() {
    if (!reached && finished()) reached = true;
    if (reached) show();
  }
  window.addEventListener("message", function (e) {
    if (e.source !== parent || !e.data || e.data.versionId !== cfg.versionId) return;
    var d = e.data;
    if (d.type === "kc:rate-config" && !cfg.direct) { config = { ask: !!d.ask, preview: !!d.preview, labels: d.labels }; check(); }
    if (d.type === "kc:rate-result" && pending[d.id]) { pending[d.id](!!d.ok); delete pending[d.id]; }
  });
  // The app page may start listening after this page loads: ask a few times.
  var hellos = 0;
  function hello() { if (framed && !cfg.direct && !config && hellos++ < 8) parent.postMessage({ type: "kc:rate-hello", versionId: cfg.versionId }, cfg.appOrigin); }
  hello();
  var timer = setInterval(function () { if (hellos < 8 && !config) hello(); check(); }, 800);
  window.addEventListener("scroll", function () { if (scrollY > 0) scrolled = true; check(); }, { passive: true });
  ["click", "input", "keydown"].forEach(function (t) { document.addEventListener(t, function (e) { if (e.target && e.target.closest && e.target.closest("[data-kc-rating]")) return; acted = true; setTimeout(check, 50); }, true); });
})();
</script></body>
