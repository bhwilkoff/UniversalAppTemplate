name: Operator

# TEMPLATE (copy to .github/workflows/operator.yml). An owner-only action on the Worker with no
# stored key: GitHub issues this run a short-lived OIDC token whose audience is the Worker's origin,
# and the Worker lets in only this file, on main, dispatched (docs/templates/worker-github-oidc-
# template.js). Only people with write access can dispatch it. Replace API, the actions and the
# routes with your own (this example lists and deletes a record by id).
# The log is public: it prints ids, dates and counts, never a name or a request reference, and
# `::add-mask::` hides each input.

on:
  workflow_dispatch:
    inputs:
      action:
        description: list finds the records; delete-record deletes one
        type: choice
        options: [list, delete-record]
        required: true
      reference:
        description: the request reference (list)
        required: false
      code:
        description: a code (list)
        required: false
      record_id:
        description: the record id from list (delete-record)
        required: false

concurrency:
  group: operator
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  operator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: https://REPLACE_WITH_WORKER_ORIGIN
      ACTION: ${{ inputs.action }}
      REFERENCE: ${{ inputs.reference }}
      CODE: ${{ inputs.code }}
      RECORD_ID: ${{ inputs.record_id }}
    steps:
      - name: Ask the Worker
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$REFERENCE" ] && echo "::add-mask::$REFERENCE"
          [ -n "$CODE" ] && echo "::add-mask::$CODE"
          tok=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$(jq -rn --arg v "$API" '$v|@uri')" | jq -r .value)
          echo "::add-mask::$tok"
          [ -n "$tok" ] && [ "$tok" != null ] || { echo "::error::no OIDC token"; exit 1; }
          out="$RUNNER_TEMP/answer.json"
          case "$ACTION" in
            list)
              if [ -n "$CODE" ]; then q="code=$(jq -rn --arg v "$CODE" '$v|@uri')"
              elif [ -n "$REFERENCE" ]; then q="reference=$(jq -rn --arg v "$REFERENCE" '$v|@uri')"
              else echo "::error::list needs a reference or a code"; exit 1; fi
              status=$(curl -sS -o "$out" -w '%{http_code}' -H "Authorization: Bearer $tok" "$API/v1/operator/records?$q")
              echo "HTTP $status"
              [ "$status" = 200 ] || exit 1
              jq -r '"\(.records | length) record(s)", (.records[] | "\(.id) created=\(.created_at / 1000 | floor | todate)")' "$out"
              ;;
            delete-record)
              [[ "$RECORD_ID" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || { echo "::error::delete-record needs a record_id from list"; exit 1; }
              status=$(curl -sS -o "$out" -w '%{http_code}' -X DELETE -H "Authorization: Bearer $tok" "$API/v1/operator/records/$RECORD_ID")
              echo "HTTP $status"
              [ "$status" = 200 ] || exit 1
              jq -r '"deleted \(.record_id) at \(.deleted_at / 1000 | floor | todate)"' "$out"
              ;;
          esac
